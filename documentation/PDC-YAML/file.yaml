- category: Data File
  description: Data files submitted by a user or generated by data analysis pipeline.
  links:
  - label: File refers to the Study it is derived from.
    name: Study
    required: 'True'
  - label: File refers to the experimental run metadata of the study it is derived
      from.
    name: Study Run Metadata
    required: 'True'
  name: File
  properties:
  - dataType: String
    name: file_id
    required: false
  - dataType: String
    name: file_type
    required: true
  - dataType: String
    name: md5sum
    required: true
  - dataType: String
    name: file_size
    required: true
  - dataType: String
    name: file_location
    required: true
  - dataType: String
    name: file_name
    required: true
  - dataType: Enumeration
    name: access
    required: true
    values:
    - open
    - controlled
  - dataType: String
    name: file_format
    required: true
  - dataType: String
    name: fraction_number
    required: true
  - dataType: Enumeration
    name: downloadable
    required: false
    values:
    - 'Yes'
    - 'No'
  - dataType: String
    name: sha1
    required: false
  - dataType: String
    name: data_category
    required: true
  - dataType: String
    name: original_file_name
    required: true
  - dataType: String
    name: dbgap_control_number
    required: false
  uniqueKeys:
  - - file_id
