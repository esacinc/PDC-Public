- name: Lab
  primaryKey: name
  properties:
  - dataType: String
    maxLength: 255
    name: name
    required: true
  - dataType: String
    maxLength: 255
    name: email
    pattern: '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$'
    required: true
  - dataType: String
    maxLength: 255
    name: program_url
    required: true
  - dataType: String
    maxLength: 255
    name: first_name
    required: true
  - dataType: String
    maxLength: 255
    name: last_name
    required: true
